name: rag-assistant

services:
  database:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-rag_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"]
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8081}:80"
    volumes:
      - reranker_data:/data

volumes:
  postgres_data:
  reranker_data:
